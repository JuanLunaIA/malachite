name: ProposalOnly reachability witness

on:
  workflow_dispatch:

jobs:
  w:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: stable}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cfg-${{ hashFiles('code/Cargo.lock') }}
      - name: Run witness
        run: |
          cd code
          set -o pipefail
          cargo test -p arc-malachitebft-config value_payload_accepts_proposal_only --release -- --nocapture 2>&1 | tee /tmp/cfg.txt
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: proposalonly-witness, path: /tmp/cfg.txt}
