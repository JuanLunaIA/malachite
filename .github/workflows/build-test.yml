name: Malachite Build & Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      RUSTFLAGS: -C debuginfo=0 -C codegen-units=1
      CARGO_INCREMENTAL: "0"
    
    steps:
      - name: Checkout Malachite
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build core crates
        run: |
          cd code
          cargo build -p arc-malachitebft-core-types -p arc-malachitebft-core-consensus -p arc-malachitebft-core-votekeeper -p arc-malachitebft-engine --lib --release
        working-directory: ./malachite
        env:
          CARGO_BUILD_JOBS: 1
          RUSTFLAGS: -C debuginfo=0 -C codegen-units=1
          CARGO_INCREMENTAL: "0"
      
      - name: Run Malachite vote_extension tests
        run: |
          cd code
          cargo test -p arc-malachitebft-test vote_extension --lib --release 2>&1 || true
        working-directory: ./malachite
        env:
          CARGO_BUILD_JOBS: 1
          RUSTFLAGS: -C debuginfo=0 -C codegen-units=1
          CARGO_INCREMENTAL: "0"
          RUST_BACKTRACE: full
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malachite-build
          path: |
            target/release/deps/
            target/release/build/
